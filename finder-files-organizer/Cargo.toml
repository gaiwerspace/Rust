[package]
name = "finder-files-organizer"
version = "0.0.1"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
num_cpus = "1.16"
tray-icon = "0.14"
winit = "0.29"
egui = "0.28"
egui-winit = "0.28"
rfd = "0.14"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.9"

[[bin]]
name = "finder-files-organizer"
path = "src/main.rs"
